<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Luna Scout</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap">
<style>
:root{--bg:#0a0c10;--ink:#e9e6df;--mute:#8d9099;--sun:#e8b86a;--cover:#05070a}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:300 16px/1.6 Inter,system-ui,sans-serif;overflow:hidden}

/* ---- crystal glass: tinted body, bright top-left edge, diagonal sheen ---- */
.glass{position:relative;overflow:hidden;border-radius:20px;
  background:linear-gradient(135deg,rgba(255,255,255,.15) 0,rgba(255,255,255,.03) 45%,rgba(255,255,255,.08) 100%);
  border:1px solid rgba(255,255,255,.18);
  backdrop-filter:blur(26px) saturate(160%) brightness(1.08);-webkit-backdrop-filter:blur(26px) saturate(160%) brightness(1.08);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 1px 0 0 rgba(255,255,255,.12),inset 0 -1px 0 rgba(255,255,255,.05),0 18px 50px rgba(0,0,0,.45)}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(115deg,rgba(255,255,255,.2) 0,rgba(255,255,255,.04) 28%,transparent 42%)}

/* ---- crystal icon badge ---- */
.gem{flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;font-size:11px;letter-spacing:.06em;color:var(--ink);
  background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.55),rgba(255,255,255,.1) 45%,rgba(255,255,255,.04));
  border:1px solid rgba(255,255,255,.25);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.6),inset 0 -6px 10px rgba(130,170,255,.14),0 4px 12px rgba(0,0,0,.35)}

/* NASA view: default Moon + Earth framing, fully interactive */
#bg{position:fixed;inset:0;width:100%;height:100%;border:0;z-index:0;background:#000}
.cover{position:fixed;z-index:1;pointer-events:none}
.c-top{top:0;left:0;right:0;height:72px;background:linear-gradient(var(--cover) 62%,transparent)}
.c-bot{bottom:0;left:0;right:0;height:110px;background:linear-gradient(transparent,var(--cover) 55%)}
.c-set{right:0;bottom:9vh;width:6vw;height:9vh;background:var(--cover)}
.scrim{position:fixed;inset:0;z-index:1;pointer-events:none;background:linear-gradient(90deg,rgba(10,12,16,.6) 0,rgba(10,12,16,0) 30%)}

#title{position:fixed;z-index:2;left:82vw;top:9vh;transform:translateX(-50%);text-align:center;pointer-events:none;white-space:nowrap}
.brand{font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--mute);margin-bottom:.5rem}
h1{font-weight:300;font-size:clamp(2rem,4vw,3.6rem);line-height:1;letter-spacing:-.02em}

#hero{z-index:2;position:fixed;left:3vw;top:42%;transform:translateY(-50%);width:min(26rem,90vw);transition:opacity .5s,transform .5s}
ol{list-style:none;padding:1.3rem 1.5rem;margin-bottom:1.8rem}
li{display:flex;align-items:center;gap:1rem;padding:.45rem 0}
button{font:inherit;color:var(--ink);cursor:pointer}
.go{padding:.85rem 1.8rem;letter-spacing:.14em;text-transform:uppercase;font-size:12px;border-radius:999px;transition:filter .25s,border-color .25s}
.go:hover{filter:brightness(1.35);border-color:rgba(255,255,255,.4)}
#spots{position:fixed;left:3vw;bottom:20vh;z-index:2;width:min(30rem,90vw);display:flex;flex-direction:column;gap:.7rem;transition:opacity .5s}
.tag{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
#chips{display:flex;flex-wrap:wrap;gap:.5rem}
.chip{padding:.45rem 1rem .45rem .8rem;border-radius:999px;font-size:13px;transition:filter .25s,border-color .25s}
.chip:hover{filter:brightness(1.35);border-color:rgba(255,255,255,.4)}
.chip::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:.55rem;vertical-align:middle;
  background:radial-gradient(circle at 30% 30%,#fff,rgba(255,255,255,.4) 55%,rgba(255,255,255,.12));box-shadow:inset 0 0 2px rgba(255,255,255,.8)}
.chip.landed::before{background:radial-gradient(circle at 30% 30%,#fff3d6,#e8b86a 60%,#a8772f);box-shadow:0 0 8px rgba(232,184,106,.45)}

#panel{z-index:2;position:fixed;left:3vw;top:50%;transform:translateY(-50%);width:min(26rem,90vw);padding:1.6rem;opacity:0;pointer-events:none;transition:opacity .5s}
body.mission #hero{opacity:0;pointer-events:none;transform:translateY(-50%) translateX(-2rem)}
body.mission #spots{opacity:0;pointer-events:none}
body.mission #panel{opacity:1;pointer-events:auto}
.back{width:34px;height:34px;font-size:15px;margin-bottom:.4rem}
label{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:1rem 0 .35rem}
select,input{width:100%;font:inherit;color:var(--ink);background:linear-gradient(135deg,rgba(255,255,255,.1),rgba(255,255,255,.03));
  border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:.6rem .8rem;color-scheme:dark;box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
.row{display:flex;gap:.7rem}.row>*{flex:1}
#note{font-size:13px;color:var(--mute);margin:.8rem 0}
.m{display:grid;grid-template-columns:1fr 1fr;gap:1rem 1.2rem;margin:1.2rem 0 .6rem}
.m b{display:block;font-weight:300;font-size:1.9rem;line-height:1.1}.m span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
canvas#chart{width:100%;height:120px;display:block;margin-top:1rem}
#msg{font-size:13px;color:var(--mute);min-height:1.2em;margin-top:.5rem}
</style></head><body>

<iframe id="bg" title="NASA Eyes on the Solar System - Moon" allow="fullscreen" allowfullscreen
 src="https://eyes.nasa.gov/apps/solar-system/#/earth/moons/moon?embed=true&logo=false&menu=false&featured=false&content=false&search=false&share=false&shareButton=false&labels=false&hideFullScreenToggle=true&layerPlanets=hide&layerSpacecraft=hide&layerSatellites=hide&layerOrbits=hide&layerTrails=hide&layerDwarfPlanets=hide&layerAsteroids=hide&layerComets=hide"></iframe>
<div class="cover c-top"></div><div class="cover c-bot"></div><div class="cover c-set"></div>
<div class="scrim"></div>

<div id="title"><div class="brand">Lunar south pole</div><h1>Luna Scout</h1></div>

<section id="hero">
  <ol class="glass">
    <li><span class="gem">01</span>Choose a landing spot</li>
    <li><span class="gem">02</span>Choose a mission date</li>
    <li><span class="gem">03</span>Take off. Find the best landing site for your spaceship.</li>
  </ol>
  <button class="go glass" id="start">Start mission</button>
</section>

<div id="spots"><span class="tag">Already landed spots on the south pole · click</span><div id="chips"></div></div>

<section id="panel" class="glass">
  <button class="gem back" id="back" aria-label="Back">←</button>
  <label>Landing spot</label><select id="site"></select>
  <div id="note"></div>
  <div class="row">
    <div><label>Mission date</label><input id="date" type="date"></div>
    <div><label>Window</label><select id="days"><option value="7">7 days</option><option value="14" selected>14 days</option><option value="30">30 days</option></select></div>
  </div>
  <button class="go glass" id="run" style="margin-top:1.2rem;width:100%">Check site</button>
  <div id="msg"></div>
  <div class="m" id="metrics"></div>
  <canvas id="chart"></canvas>
</section>

<script>
const $=id=>document.getElementById(id);
let sites=[];

const showNote=()=>{const s=sites.find(x=>x.id===$('site').value);$('note').textContent=s?`${s.status==='landed'?'Landed':'Candidate'} · ${s.lat}°, ${s.lon}° · ${s.note}`:'';};
const openMission=()=>{document.body.classList.add('mission');showNote();};
$('start').onclick=openMission;
$('back').onclick=()=>document.body.classList.remove('mission');
$('date').value=new Date(Date.now()+30*864e5).toISOString().slice(0,10);
$('site').onchange=showNote;

$('run').onclick=async()=>{
  $('msg').textContent='Computing…';$('metrics').innerHTML='';
  try{const q=new URLSearchParams({site:$('site').value,start:$('date').value,days:$('days').value});
    const r=await fetch('/api/timeline?'+q);const d=await r.json();if(!r.ok)throw new Error(d.detail);
    const S=d.summary;
    $('msg').textContent=S.terrain_aware?'Terrain-aware horizon.':'Flat horizon only: add a terrain profile for real polar results.';
    const m=[[S.sunlit_hours+' h','Sunlit'],[S.earth_hours+' h','Earth in view'],[S.longest_dark_hours+' h','Longest dark spell'],[S.max_sun_el+'°','Peak sun elevation']];
    $('metrics').innerHTML=m.map(([v,l])=>`<div><b>${v}</b><span>${l}</span></div>`).join('');
    draw(d);}catch(e){$('msg').textContent=e.message;}};

function draw(d){const c=$('chart'),k=devicePixelRatio,W=c.clientWidth,H=c.clientHeight;c.width=W*k;c.height=H*k;
  const g=c.getContext('2d');g.scale(k,k);const n=d.t.length,y=v=>H/2-(v/30)*(H/2-6),x=i=>i/(n-1)*W;
  g.strokeStyle='rgba(255,255,255,.2)';g.beginPath();g.moveTo(0,y(0));g.lineTo(W,y(0));g.stroke();
  [['sun_el','#e8b86a'],['earth_el','#7fb3d5']].forEach(([key,col])=>{g.strokeStyle=col;g.lineWidth=1.5;g.beginPath();
    d[key].forEach((v,i)=>i?g.lineTo(x(i),y(Math.max(-30,Math.min(30,v)))):g.moveTo(0,y(v)));g.stroke();});
  g.fillStyle='#8d9099';g.font='10px Inter,sans-serif';g.fillText('horizon',4,y(0)-4);}

fetch('/api/sites').then(r=>r.json()).then(s=>{sites=s;
  $('site').innerHTML=s.map(x=>`<option value="${x.id}">${x.name}</option>`).join('');
  $('chips').innerHTML=s.map(x=>`<button class="chip glass ${x.status}" data-id="${x.id}">${x.name.split(' (')[0]}</button>`).join('');
  $('chips').onclick=e=>{const b=e.target.closest('.chip');if(b){$('site').value=b.dataset.id;openMission();}};showNote();});
</script>
</body>
</html>
